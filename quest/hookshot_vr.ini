; Hookshot VR (Meta Quest over Quest Link / Air Link / Virtual Desktop). Read when the game starts, and again when it changes.
; The Insert menu's VR tab sets these lines too: there is no need to edit this file by hand.
; vr=0 plays on the desktop only; the environment variable RX_VR=0 or 1 overrides it.
vr=1
; the screen: metres in front of you, its width in metres, its middle above (+) or below (-) eye height
screen_distance=2.6
screen_width=3.6
screen_height=0.0
; 1: the right controller's motion is the gamepad's gyroscope (the game's Motion controls, for aiming)
gyro=1
; 1: move with the right stick and turn the camera with the left
swap_sticks=0

; stereo 3D: the game's own camera at your eyes (one eye a frame), so the world has depth and you can lean and look around
; (needs the rebuilt game: quest/README.md). 0: the flat screen above. The Insert menu always shows on the screen.
stereo=1
; game metres for one real metre: 1 life size, larger makes the world a diorama in front of you
world_scale=1.0
; 1: the game camera's tilt left out, so the horizon stays level (the comfortable one); 0: the camera tilts as the game's does
horizon_lock=1
; 1: moving your head moves the eyes in the world; 0: only turning your head counts
head_motion=1


; the HUD (hearts, buttons, map, text) on its own panel pinned to your view, not drawn into the 3D picture. 0: in the picture
hud=1
; that panel: metres in front of your eyes, its width in metres, its middle above (+) or below (-) eye height
hud_distance=1.6
hud_width=1.9
hud_height=-0.05

; stereo: how far apart the eyes are, times your real eyes' distance (0: both eyes see the same picture; read live)
stereo_separation=1.0

; stereo: 1 the game draws the headset's whole field of view (no black bars); 0 its own narrower view in a window
stereo_fill=1

; stereo: 1 DLSS / FSR allowed (smoother, may ghost on near edges); 0 the game's own upscaler (sharper edges, more shimmer). Read live
stereo_dlss=1

; stereo, the desktop window: 1 both eyes side by side, 2 the left eye alone filling the window (best for recording), 0 the raw frames. Read live
mirror=2
; 1: the Quest Touch controllers act as a gamepad; 0: ignored (use this when you play with another controller). Read live
touch_controllers=1
; stereo: 1 each pair of eyes is given to the headset once, the standard way, so the headset own smoothing (ASW) can work; 0 the old way. Read live
stereo_pace=1
; stereo: the renderer's own camera smoothing between frames (leave 0 with stereo_pace=1)
stereo_smooth=0
; the HUD's middle (aiming reticles) shown where the game aims, far away, not on the head-locked panel. 0: all on the panel
hud_aim=1
; how much of the HUD's width and height counts as the middle (0.05 to 0.9)
hud_center=0.3
; metres to the reticle layer
hud_aim_distance=25
; stereo: 1 the game advances in pairs of frames so both eyes show the same moment (smoother fast motion); 0 off. Read live
stereo_sync=1
; the second frame of a pair's step, microseconds (4167 is the least the game takes: lower crashes it)
sync_step_us=4167
; first person: your eyes at Link's face. Tap the left stick (or F9) to switch it on and off while playing. 1: on at the start
first_person=0
; metres above and ahead of the point the game camera looks at on Link, to tune where your eyes sit
fp_height=0.25
fp_forward=0.2
