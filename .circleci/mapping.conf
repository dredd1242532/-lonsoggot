# Path filtering: last matching line wins for a parameter. full forces every area on.
# .forgejo/ only changes lint (always runs), so it maps to docs_only.
\.circleci/.* full true
mise\.toml full true
tools\.lock full true
mise\.lock full true
requirements\.txt full true
nx2/prompt_requirements\.txt full true
\.pre-commit-config\.yaml full true

tests/.* tests true
nx2/.* tests true
host/.* tests true
scripts/.* tests true
gpu/.* tests true
gpu/.* gpu true
third_party/imgui/.* gpu true
third_party/zstd/.* gpu true
nx2/build\.py gpu true
scripts/fetch_commit\.sh gpu true

scripts/linux/.* linux true
host/posix/.* linux true
builder/linux/.* linux true
assets/.* linux true

builder/.* windows true
scripts/windows/.* windows true
scripts/builder_package\.py windows true
scripts/check_windows_files\.py windows true
tests/builder_cli/.* windows true
tools\.lock windows true

website/.* website true
docs/tested-configurations\.md website true
docs/tested/.* website true
\.circleci/.* website true

third_party/.* thirdparty true
scripts/check_third_party\.py thirdparty true
PROVENANCE\.md thirdparty true

^docs/.* docs_only true
\.forgejo/.* docs_only true
.*\.md$ docs_only true
CONTRIBUTING\.md docs_only true
RELEASING\.md docs_only true
CHANGELOG\.md docs_only true
AGENTS\.md docs_only true
README\.md docs_only true
